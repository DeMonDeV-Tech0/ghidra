name: Sync Ghidra Releases

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: ghidra-release-sync
  cancel-in-progress: false

jobs:
  sync-releases:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. SYNCHRONISATION DES TAGS
      # ============================================================

      - name: Sync tags from official repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          set -o pipefail

          SOURCE_REPO="https://github.com/NationalSecurityAgency/ghidra.git"
          TARGET_REPO="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          echo "===================================="
          echo "Synchronisation des tags"
          echo "===================================="
          echo "Source : $SOURCE_REPO"
          echo "Target : $GITHUB_REPOSITORY"
          echo ""

          rm -rf ghidra.git

          git clone --bare "$SOURCE_REPO" ghidra.git

          cd ghidra.git

          git push --force --tags "$TARGET_REPO"

          cd ..

          rm -rf ghidra.git

          echo ""
          echo "Tags synchronisés."


      # ============================================================
      # 2. SYNCHRONISATION DES RELEASES
      # ============================================================

      - name: Sync releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          set -o pipefail

          SOURCE="NationalSecurityAgency/ghidra"
          TARGET="${GITHUB_REPOSITORY}"

          echo ""
          echo "===================================="
          echo "Synchronisation des Releases"
          echo "===================================="
          echo "Source : $SOURCE"
          echo "Target : $TARGET"
          echo ""

          rm -rf /tmp/releases
          mkdir -p /tmp/releases


          # ========================================================
          # Récupération de toutes les releases officielles
          # ========================================================

          echo "Récupération des Releases officielles..."

          gh api --paginate --slurp \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${SOURCE}/releases?per_page=100" \
            > /tmp/releases.json

          RELEASE_COUNT=$(
            jq '[.[][] | select(.draft == false)] | length' \
            /tmp/releases.json
          )

          echo "Releases trouvées : $RELEASE_COUNT"
          echo ""


          # ========================================================
          # Récupération du VRAI Latest officiel
          # ========================================================

          echo "Récupération du Latest officiel..."

          LATEST_TAG=$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${SOURCE}/releases/latest" \
              --jq '.tag_name'
          )

          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            echo "ERREUR : impossible de récupérer le Latest officiel."
            exit 1
          fi

          echo "Latest officiel : $LATEST_TAG"
          echo ""


          # ========================================================
          # Fonction : récupérer une release du fork
          # ========================================================

          get_target_release() {
            local tag="$1"

            gh release view "$tag" \
              --repo "$TARGET" \
              --json databaseId,name,tagName,uploadUrl,assets \
              2>/dev/null || true
          }


          # ========================================================
          # Fonction : vérifier DIRECTEMENT si l'asset existe
          # ========================================================

          target_asset_exists() {
            local release_id="$1"
            local asset_name="$2"

            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${TARGET}/releases/${release_id}/assets?per_page=100" \
              --jq \
                --arg name "$asset_name" \
                '.[] | select(.name == $name) | .id' \
              2>/dev/null || true
          }


          # ========================================================
          # Fonction : supprimer un asset existant si nécessaire
          # ========================================================

          delete_target_asset() {
            local asset_id="$1"
            local asset_name="$2"

            if [ -z "$asset_id" ] || [ "$asset_id" = "null" ]; then
              return 0
            fi

            echo ""
            echo "Asset déjà présent sur GitHub."
            echo "Asset ID : $asset_id"
            echo "Nom      : $asset_name"
            echo "Suppression de l'ancien asset..."

            gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${TARGET}/releases/assets/${asset_id}"

            echo "Ancien asset supprimé."
          }


          # ========================================================
          # Fonction : upload d'un asset
          # ========================================================

          upload_asset() {
            local release_id="$1"
            local asset_name="$2"
            local asset_file="$3"

            if [ -z "$release_id" ] || [ "$release_id" = "null" ]; then
              echo "ERREUR : release_id invalide."
              echo "release_id = $release_id"
              return 1
            fi

            if [ ! -f "$asset_file" ]; then
              echo "ERREUR : fichier introuvable."
              echo "fichier = $asset_file"
              return 1
            fi

            local encoded_name
            local upload_url

            encoded_name=$(printf '%s' "$asset_name" | jq -sRr @uri)

            upload_url="https://uploads.github.com/repos/${TARGET}/releases/${release_id}/assets"

            echo ""
            echo "------------------------------------"
            echo "Upload de l'asset"
            echo "------------------------------------"
            echo "Release ID : $release_id"
            echo "Asset      : $asset_name"
            echo "Fichier    : $asset_file"
            echo "Upload URL : $upload_url"
            echo ""

            curl -fL \
              --retry 3 \
              --retry-delay 5 \
              --retry-all-errors \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${asset_file}" \
              "${upload_url}?name=${encoded_name}"

            echo ""
            echo "Upload terminé : $asset_name"
          }


          # ========================================================
          # Parcours des releases officielles
          # ========================================================

          jq -c '.[][] | select(.draft == false)' /tmp/releases.json |
          while read -r release; do

            TAG=$(echo "$release" | jq -r '.tag_name')
            NAME=$(echo "$release" | jq -r '.name')
            BODY=$(echo "$release" | jq -r '.body // ""')
            PRERELEASE=$(echo "$release" | jq -r '.prerelease')
            ASSET_COUNT=$(echo "$release" | jq '.assets | length')

            echo ""
            echo "===================================="
            echo "Release : $TAG"
            echo "Nom     : $NAME"
            echo "Assets  : $ASSET_COUNT"
            echo "===================================="


            # ======================================================
            # Vérification de l'existence sur le fork
            # ======================================================

            EXISTING=$(get_target_release "$TAG")

            if [ -n "$EXISTING" ] && \
               echo "$EXISTING" |
               jq -e '.databaseId != null' >/dev/null 2>&1; then

              echo "Release $TAG existe déjà."

              TARGET_ID=$(echo "$EXISTING" | jq -r '.databaseId')

              echo "Release ID cible : $TARGET_ID"

            else

              # ====================================================
              # Release absente : création
              # ====================================================

              echo "Release $TAG absente."
              echo "Création de la Release..."

              if [ "$PRERELEASE" = "true" ]; then

                gh release create "$TAG" \
                  --repo "$TARGET" \
                  --title "$NAME" \
                  --notes "$BODY" \
                  --prerelease \
                  --verify-tag

              else

                gh release create "$TAG" \
                  --repo "$TARGET" \
                  --title "$NAME" \
                  --notes "$BODY" \
                  --verify-tag

              fi

              echo "Release créée."


              # ====================================================
              # Récupération de la Release nouvellement créée
              # ====================================================

              EXISTING=$(get_target_release "$TAG")

              if [ -z "$EXISTING" ]; then
                echo "ERREUR : impossible de récupérer la Release créée."
                echo "Tag : $TAG"
                exit 1
              fi

              if ! echo "$EXISTING" |
                jq -e '.databaseId != null' >/dev/null 2>&1; then

                echo "ERREUR : databaseId absent."
                echo "$EXISTING"
                exit 1
              fi

              TARGET_ID=$(echo "$EXISTING" | jq -r '.databaseId')

              echo "Release ID cible : $TARGET_ID"

            fi


            # ======================================================
            # Synchronisation des assets
            # ======================================================

            if [ "$ASSET_COUNT" -eq 0 ]; then
              echo "Aucun asset à synchroniser."
              continue
            fi

            echo ""
            echo "Vérification des assets..."


            echo "$release" |
            jq -c '.assets[]?' |
            while read -r asset; do

              ASSET_NAME=$(echo "$asset" | jq -r '.name')
              DOWNLOAD_URL=$(echo "$asset" | jq -r '.browser_download_url')

              echo ""
              echo "------------------------------------"
              echo "Asset : $ASSET_NAME"
              echo "------------------------------------"


              # ====================================================
              # Vérification DIRECTE sur GitHub
              # ====================================================

              TARGET_ASSET=$(
                target_asset_exists \
                  "$TARGET_ID" \
                  "$ASSET_NAME"
              )

              if [ -n "$TARGET_ASSET" ] &&
                 [ "$TARGET_ASSET" != "null" ]; then

                echo "Asset déjà présent."
                echo "ID asset : $TARGET_ASSET"
                echo "Aucun téléchargement nécessaire."

                continue
              fi


              # ====================================================
              # Asset absent : téléchargement
              # ====================================================

              FILE="/tmp/releases/$ASSET_NAME"

              echo "Asset absent du fork."
              echo "Téléchargement depuis le dépôt officiel..."
              echo "URL : $DOWNLOAD_URL"

              curl -fL \
                --retry 3 \
                --retry-delay 5 \
                --retry-all-errors \
                "$DOWNLOAD_URL" \
                -o "$FILE"

              echo ""
              echo "Téléchargement terminé."


              # ====================================================
              # Vérification du fichier
              # ====================================================

              if [ ! -s "$FILE" ]; then
                echo "ERREUR : fichier téléchargé vide."
                rm -f "$FILE"
                exit 1
              fi

              FILE_SIZE=$(stat -c%s "$FILE")

              echo "Taille : $FILE_SIZE octets"


              # ====================================================
              # DERNIÈRE vérification avant upload
              # ====================================================

              CURRENT_TARGET_ASSET=$(
                target_asset_exists \
                  "$TARGET_ID" \
                  "$ASSET_NAME"
              )

              if [ -n "$CURRENT_TARGET_ASSET" ] &&
                 [ "$CURRENT_TARGET_ASSET" != "null" ]; then

                echo ""
                echo "L'asset existe maintenant sur le dépôt cible."
                echo "ID asset : $CURRENT_TARGET_ASSET"
                echo "Suppression de l'ancien asset avant réupload."

                delete_target_asset \
                  "$CURRENT_TARGET_ASSET" \
                  "$ASSET_NAME"
              fi


              # ====================================================
              # Upload vers le fork
              # ====================================================

              upload_asset \
                "$TARGET_ID" \
                "$ASSET_NAME" \
                "$FILE"


              # ====================================================
              # Nettoyage
              # ====================================================

              rm -f "$FILE"

              echo ""
              echo "Asset synchronisé : $ASSET_NAME"

            done

            echo ""
            echo "Release synchronisée : $TAG"

          done


          # ========================================================
          # 3. FORCER LE LATEST À ÊTRE IDENTIQUE À L'OFFICIEL
          # ========================================================

          echo ""
          echo "===================================="
          echo "Synchronisation du Latest"
          echo "===================================="
          echo "Latest officiel : $LATEST_TAG"
          echo ""


          # Vérifie que la release existe bien sur le fork

          LATEST_TARGET=$(
            get_target_release "$LATEST_TAG"
          )

          if [ -z "$LATEST_TARGET" ] || \
             ! echo "$LATEST_TARGET" |
             jq -e '.databaseId != null' >/dev/null 2>&1; then

            echo "ERREUR : la release Latest n'existe pas sur le dépôt cible."
            echo "Tag : $LATEST_TAG"
            exit 1
          fi


          echo "Marquage de $LATEST_TAG comme Latest..."

          gh release edit "$LATEST_TAG" \
            --repo "$TARGET" \
            --latest

          echo ""
          echo "Latest synchronisé : $LATEST_TAG"


          # ========================================================
          # Nettoyage final
          # ========================================================

          rm -rf /tmp/releases
          rm -f /tmp/releases.json

          echo ""
          echo "===================================="
          echo "Synchronisation terminée."
          echo "===================================="
